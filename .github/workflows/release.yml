name: Release & Deployment

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy (e.g. v0.1.0)"
        required: false

permissions:
  contents: write
  packages: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  verify:
    name: Pre-Release Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Run linter
        run: bun run lint

      - name: Run workspace checks & tests
        run: bunx moon check --all

  deploy-core:
    name: 1. Migrate D1 & Deploy Core Worker
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply Remote D1 Database Migrations
        run: bunx wrangler d1 migrations apply cuan --remote --config core/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Backend Cloudflare Worker
        run: bunx wrangler deploy --config core/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-web:
    name: 2. Build & Deploy Frontend Assets
    needs: deploy-core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build UI Package
        run: bun run --cwd packages/ui build

      - name: Build Web Application
        run: bun run --cwd web build

      - name: Deploy Frontend Assets to Cloudflare
        run: bunx wrangler deploy --config web/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  github-release:
    name: 3. Create GitHub Release
    needs: deploy-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract Release Notes from CHANGELOG
        run: |
          bun -e '
            const fs = require("node:fs");
            const rawVersion = process.env.TAG_OR_INPUT || "";
            const version = rawVersion.replace(/^refs\/tags\//, "").replace(/^v/, "");
            let notes = "";
            if (fs.existsSync("CHANGELOG.md")) {
              const text = fs.readFileSync("CHANGELOG.md", "utf8");
              const escaped = version.replace(/\./g, "\\.");
              const regex = new RegExp("## \\[" + escaped + "\\][^\\n]*\\n\\n([\\s\\S]*?)(?=\\n## \\[|$)", "u");
              const match = text.match(regex);
              if (match) {
                notes = match[1].trim();
              }
            }
            fs.writeFileSync("RELEASE_NOTES.md", notes, "utf8");
          '
        env:
          TAG_OR_INPUT: ${{ github.ref_name || inputs.tag }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          name: Release ${{ github.ref_name || inputs.tag }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          draft: false
          prerelease: false
